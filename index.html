<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYDR しろやま田園鉄道公式サイト</title>

  <style>
    :root {
      --main-color: #1e6bd6;
      --bg-color: #ffffff;
      --sub-color: #f2f6ff;
    }

    body {
      margin: 0;
      padding-top: 72px; /* fixedヘッダー対策 */
      font-family: "Noto Sans JP", sans-serif;
      background: var(--bg-color);
      color: #222;
      line-height: 1.8;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 1000;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      color: var(--main-color);
    }

    .hero {
      background: var(--sub-color);
      padding: 80px 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 36px;
      margin-bottom: 16px;
      color: var(--main-color);
    }

    .hero p {
      font-size: 18px;
      color: #555;
    }

    section {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    section h3 {
      font-size: 24px;
      margin-bottom: 16px;
      border-left: 6px solid var(--main-color);
      padding-left: 12px;
    }

    footer {
      background: #f7f7f7;
      text-align: center;
      padding: 24px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>SYDR しろやま田園鉄道公式サイト</h1>
  </header>

  <div class="hero">
    <h2>SYDR しろやま田園鉄道公式サイト</h2>
    <p>ロブロックスで展開する架空鉄道プロジェクト</p>
  </div>

  <section>
    <h3>お知らせ</h3>
    <p>
      SYDR しろやま田園鉄道公式サイトへようこそ。<br />
      当サイトでは、路線情報・車両・開発状況などを掲載していきます。
    </p>
  </section>

  <section>
    <h3>プロジェクト概要</h3>
    <p>
      SYDR しろやま田園鉄道は、ロブロックス上で制作されている
      オリジナル鉄道ワールドです。<br />
      リアルさと遊びやすさの両立を目指して開発しています。
    </p>
  </section>

  <footer>
    © SYDR しろやま田園鉄道公式サイト
  </footer>

</body>
</html>
